<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshops IA · U.Porto</title>
<meta name="description" content="Edições do workshop IA Aplicada ao Trabalho Administrativo na Universidade do Porto.">
<style>
  :root {
    --navy:#0D2D52; --cyan:#0891B2; --amber:#F59E0B; --green:#10B981;
    --slate9:#1E293B; --slate6:#475569; --slate2:#E2E8F0; --slate1:#F1F5F9; --white:#FFFFFF;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', system-ui, sans-serif; background:var(--slate1); color:var(--slate9); line-height:1.6; }
  header { background:var(--navy); color:var(--white); padding:2.5rem 1rem 2rem; text-align:center; }
  header .tag { font-size:.75rem; font-weight:700; letter-spacing:.2em; color:var(--cyan); text-transform:uppercase; margin-bottom:.5rem; }
  header h1 { font-size:clamp(1.5rem,4.5vw,2.4rem); font-weight:800; line-height:1.2; margin-bottom:.5rem; }
  header p { font-size:.95rem; color:#B8D4E8; max-width:620px; margin:0 auto; }
  main { max-width:960px; margin:0 auto; padding:2rem 1rem 4rem; }
  .label { font-size:.7rem; font-weight:700; letter-spacing:.2em; color:var(--cyan); text-transform:uppercase; margin:0 0 .75rem; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  @media(max-width:700px){ .grid { grid-template-columns:1fr; } }
  .ed { display:flex; flex-direction:column; background:var(--white); border:1px solid var(--slate2); border-radius:.75rem; padding:1.4rem 1.5rem; box-shadow:0 1px 4px rgba(0,0,0,.06); text-decoration:none; color:inherit; transition:transform .15s, box-shadow .15s; }
  .ed:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(13,45,82,.12); }
  .ed.current { border-top:4px solid var(--cyan); }
  .ed.past { border-top:4px solid var(--slate2); }
  .badge { align-self:flex-start; font-size:.68rem; font-weight:800; padding:.15rem .55rem; border-radius:99px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:.6rem; }
  .b-now { background:#D1FAE5; color:#065F46; }
  .b-past { background:var(--slate1); color:var(--slate6); border:1px solid var(--slate2); }
  .ed .date { font-size:.85rem; font-weight:700; color:var(--cyan); }
  .ed h2 { font-size:1.2rem; font-weight:800; color:var(--navy); margin:.15rem 0 .4rem; line-height:1.3; }
  .ed p { font-size:.87rem; color:var(--slate6); }
  .ed ul { list-style:none; margin:.75rem 0 0; font-size:.82rem; color:var(--slate6); }
  .ed li { padding:.2rem 0; border-top:1px solid var(--slate1); }
  .ed li strong { color:var(--slate9); }
  .ed .cta { margin-top:auto; padding-top:1rem; font-size:.85rem; font-weight:700; color:var(--cyan); }
  .turmas { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:1rem; }
  .turmas a { font-size:.8rem; font-weight:700; color:var(--white); background:var(--cyan); padding:.35rem .9rem; border-radius:99px; text-decoration:none; }
  .turmas a.alt { background:var(--navy); }
  .turmas a:hover { opacity:.88; }
  .note { margin-top:2rem; background:var(--white); border:1px solid var(--slate2); border-left:4px solid var(--amber); border-radius:.5rem; padding:1rem 1.25rem; font-size:.87rem; color:var(--slate6); }
  footer { background:var(--navy); color:#8AA9C4; text-align:center; font-size:.8rem; padding:1.5rem 1rem; }
  footer a { color:#B8D4E8; }
  header { position:relative; }
  nav.top { position:absolute; top:.9rem; left:1rem; right:1rem; display:flex; justify-content:space-between; align-items:center; }
  nav.top a { font-size:.8rem; font-weight:700; color:#8AA9C4; text-decoration:none; }
  nav.top a:hover { color:var(--white); }
  #lang { background:transparent; color:var(--white); border:1px solid rgba(255,255,255,.35); border-radius:99px; font:inherit; font-size:.75rem; font-weight:800; padding:.2rem .7rem; cursor:pointer; min-height:32px; }
  #lang:hover { background:var(--cyan); border-color:var(--cyan); }
  @media(max-width:640px){ header { padding-top:3.2rem; } }
</style>
</head>
<body>
<header>
  <nav class="top"><a id="home" href="../">← Ricardo Cruz-Correia</a><button id="lang" type="button">EN</button></nav>
  <div class="tag" data-i18n="tag"></div>
  <h1 data-i18n="h1"></h1>
  <p data-i18n="lede"></p>
</header>

<main>
  <div class="label" data-i18n="eds"></div>
  <div class="grid">
    <div class="ed current">
      <span class="badge b-now" data-i18n="e2badge"></span>
      <div class="date" data-i18n="e2date"></div>
      <h2 data-i18n="e2place"></h2>
      <p data-i18n="e2desc"></p>
      <ul>
        <li data-i18n="e2s1"></li>
        <li data-i18n="e2s2"></li>
      </ul>
      <div class="turmas">
        <a href="workshop-nov2026.html?turma=A" data-i18n="e2b1"></a>
        <a class="alt" href="workshop-nov2026.html?turma=B" data-i18n="e2b2"></a>
      </div>
    </div>

    <a class="ed past" href="workshop.html">
      <span class="badge b-past" data-i18n="e1badge"></span>
      <div class="date" data-i18n="e1date"></div>
      <h2>Auditório Ruy Luís Gomes</h2>
      <p data-i18n="e1desc"></p>
      <ul>
        <li data-i18n="e1am"></li>
        <li data-i18n="e1pm"></li>
      </ul>
      <span class="cta" data-i18n="e1cta"></span>
    </a>
  </div>

  <div class="note" data-i18n="note"></div>
</main>

<footer>
  <p>Ricardo Correia · Helder Palheira · Jannine Nascimento</p>
  <p style="margin-top:.3rem"><a id="talks" href="../intervencoes/?tema=GenAI" data-i18n="talks"></a></p>
</footer>
<script>
const T = {
  pt: {
    title: "Workshops IA · U.Porto",
    tag: "Universidade do Porto · Formação em IA Generativa",
    h1: "IA Aplicada ao Trabalho Administrativo",
    lede: "Workshops práticos para técnicos e dirigentes dos serviços da U.Porto. Cada edição tem o seu hub com agenda, ferramentas e todos os prompts dos exercícios.",
    eds: "Edições",
    e2badge: "2.ª edição · a decorrer",
    e2date: "6 e 13 de novembro de 2026 · 09h30 – 12h30",
    e2place: "Reitoria da U.Porto · Auditório Ruy Luís Gomes",
    e2desc: "~65 participantes, em duas manhãs (6 h). Conteúdos atualizados: agentes, instruções reutilizáveis, prompt injection e o AI Act em vigor.",
    e2s1: "<strong>Sessão 1</strong> · sexta, 6 nov · Enquadramento · Limites · Prompt Engineering",
    e2s2: "<strong>Sessão 2</strong> · sexta, 13 nov · Folhas de cálculo · Ferramentas · Atelier · Encerramento",
    e2b1: "Sessão 1 →", e2b2: "Sessão 2 →",
    e1badge: "1.ª edição · concluída",
    e1date: "16 de junho de 2026",
    e1desc: "Primeira edição do workshop, num dia: enquadramento, limites e alucinações, prompt engineering, folhas de cálculo, ferramentas avançadas e atelier por unidade.",
    e1am: "<strong>Manhã</strong> · M1 Enquadramento · M2 Limites · M3 Prompt Engineering",
    e1pm: "<strong>Tarde</strong> · T1 Folhas de cálculo · T2 Ferramentas · T3 Atelier · T4 Encerramento",
    e1cta: "Abrir hub de junho →",
    note: "💡 Os prompts das duas edições podem ser copiados e adaptados livremente. Regra de ouro: <strong>verificar, proteger, atribuir, supervisionar, decidir</strong>.",
    talks: "Outras apresentações e intervenções →"
  },
  en: {
    title: "AI Workshops · U.Porto",
    tag: "University of Porto · Generative AI Training",
    h1: "Applied AI for Administrative Work",
    lede: "Hands-on workshops for staff and managers of the University of Porto services. Each edition has its own hub with the agenda, tools and every exercise prompt (hubs in Portuguese).",
    eds: "Editions",
    e2badge: "2nd edition · in progress",
    e2date: "6 and 13 November 2026 · 09:30 – 12:30",
    e2place: "Rectorate of U.Porto · Ruy Luís Gomes Auditorium",
    e2desc: "~65 participants over two mornings (6 h). Updated content: AI agents, reusable instructions, prompt injection and the EU AI Act now in force.",
    e2s1: "<strong>Session 1</strong> · Friday, 6 Nov · Overview · Limits · Prompt engineering",
    e2s2: "<strong>Session 2</strong> · Friday, 13 Nov · Spreadsheets · Advanced tools · Workshop · Closing",
    e2b1: "Session 1 →", e2b2: "Session 2 →",
    e1badge: "1st edition · completed",
    e1date: "16 June 2026",
    e1desc: "First edition, in one day: overview, limits and hallucinations, prompt engineering, spreadsheets, advanced tools and a hands-on workshop by faculty.",
    e1am: "<strong>Morning</strong> · M1 Overview · M2 Limits · M3 Prompt engineering",
    e1pm: "<strong>Afternoon</strong> · T1 Spreadsheets · T2 Tools · T3 Workshop · T4 Closing",
    e1cta: "Open June hub →",
    note: "💡 Prompts from both editions may be freely copied and adapted. Golden rule: <strong>verify, protect, disclose, supervise, decide</strong>.",
    talks: "Other talks and presentations →"
  }
};
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const q = new URLSearchParams(location.search).get("lang");
let lang = (q === "pt" || q === "en") ? q
  : (store.get("site_lang") || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en"));
if (lang !== "pt" && lang !== "en") lang = "pt";
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelectorAll("[data-i18n]").forEach(el => el.innerHTML = t[el.dataset.i18n]);
  const b = document.getElementById("lang");
  b.textContent = lang === "pt" ? "EN" : "PT";
  b.setAttribute("aria-label", lang === "pt" ? "Switch to English" : "Mudar para português");
  document.getElementById("home").href = "../?lang=" + lang;
  document.getElementById("talks").href = "../intervencoes/?tema=GenAI&lang=" + lang;
}
document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "pt" ? "en" : "pt"; store.set("site_lang", lang);
  const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u);
  render();
});
render();
</script>
</body>
</html>
